databases:
  - name: srkrcc-postgres
    databaseName: srkrcc_db
    user: srkrcc_user
    plan: free
    region: singapore

services:
  - type: web
    name: srkrcc-backend
    runtime: python
    region: singapore
    plan: free
    healthCheckPath: /api/ping/
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: srkrcc-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false   # your custom API hostname(s), e.g. api.srkrcc.in (the .onrender.com host is added automatically)
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # the deployed frontend origin, e.g. https://srkrcc.in
      - key: CSRF_TRUSTED_ORIGINS
        sync: false   # same origin(s) as above
      - key: FRONTEND_URL
        sync: false   # public frontend URL used in email links; the backend will not start without it
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@srkr.ac.in"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: CLIENT_IP_SHARED_SECRET
        sync: false   # random string; set the same value in the frontend's CLIENT_IP_SHARED_SECRET
      - key: TRUSTED_PROXY_COUNT
        value: "1"    # Render's proxy; add 1 for each extra proxy/CDN in front (e.g. Cloudflare = 2)
      - key: SENTRY_DSN
        sync: false   # optional: error tracking
