name: CI

# Pull requests into main only. This workflow does not deploy and does not
# receive AWS credentials or production secrets.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    # Pin 24.04: ubuntu-latest began moving to Ubuntu 26 on 2026-10-19 and
    # the image job was exiting in a few seconds before Docker could build.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srkrcc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d srkrcc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-used-in-production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/srkrcc_db
      EMAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check migrations match the models
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity=1

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Lambda image without pushing
        run: |
          set -euo pipefail
          # --provenance=false needs Buildx. One retry covers a transient
          # Docker Hub failure. The adapter is compiled in the Dockerfile, so
          # this build does not pull public.ecr.aws.
          if ! docker build --platform linux/amd64 --provenance=false -t srkrcc-backend:ci .; then
            echo "First image build failed; retrying once."
            docker build --platform linux/amd64 --provenance=false -t srkrcc-backend:ci .
          fi
