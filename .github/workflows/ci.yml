name: CI

# Pull requests into main only. This workflow does not deploy and does not
# receive AWS credentials or production secrets.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    # Pin 24.04: ubuntu-latest began moving to Ubuntu 26 on 2026-10-19 and
    # the image job was exiting in a few seconds before Docker could build.
    runs-on: ubuntu-24.04
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-used-in-production
      DATABASE_URL: sqlite:////tmp/ci.sqlite3
      EMAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check migrations match the models
        run: python manage.py makemigrations --check --dry-run

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Lambda image without pushing
        run: |
          set -euo pipefail
          # --provenance=false needs Buildx. One retry covers a transient
          # Docker Hub failure. The adapter binary is copied from the repo, so
          # this build does not pull public.ecr.aws.
          if ! docker build --platform linux/amd64 --provenance=false -t srkrcc-backend:ci .; then
            echo "First image build failed; retrying once."
            docker build --platform linux/amd64 --provenance=false -t srkrcc-backend:ci .
          fi
