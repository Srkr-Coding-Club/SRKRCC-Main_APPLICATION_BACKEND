name: Deploy Lambda

# Deploy only after a commit lands on main. Pull requests never run this
# workflow. Render and Vercel are not part of it.
on:
  push:
    branches:
      - main

concurrency:
  group: lambda-deploy-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 745999343357.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: srkrcc-backend
  IMAGE_TAG: ${{ github.sha }}
  LAMBDA_FUNCTION_NAME: srkrcc-dev-backend
  SSM_SECRET_KEY_NAME: /srkrcc/dev/backend/secret_key
  SSM_DATABASE_URL_NAME: /srkrcc/dev/backend/database_url
  # Same host list Django expects with DEBUG=False. Migrates do not serve
  # HTTP; they only need settings to load. Default matches Terraform's
  # Lambda ALLOWED_HOSTS. Override with repository variable ALLOWED_HOSTS
  # when a custom API hostname is added.
  ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS || '.lambda-url.ap-south-1.on.aws' }}

jobs:
  deploy:
    # Pin 24.04 while ubuntu-latest migrates to Ubuntu 26 (started 2026-10-19).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Require the GitHub Actions deploy role
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo "::error::Set the repository variable AWS_DEPLOY_ROLE_ARN to the IAM role GitHub Actions may assume."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 --provenance=false -t "$image" .
          docker push "$image"
          ecr_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query "imageDetails[0].imageDigest" \
            --output text)"
          if ! printf '%s' "$ecr_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::ECR did not return a digest for the image built from $IMAGE_TAG."
            exit 1
          fi
          echo "IMMUTABLE_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY@$ecr_digest" >> "$GITHUB_ENV"
          echo "Deploying immutable image $ECR_REGISTRY/$ECR_REPOSITORY@$ecr_digest"

      - name: Migrate, create the cache table, and seed
        env:
          # Secret, not a variable: never store the admin password in plain text.
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          DJANGO_SUPERUSER_EMAIL: ${{ vars.DJANGO_SUPERUSER_EMAIL || 'srkrcodingclubofficial@gmail.com' }}
        run: |
          set -euo pipefail
          # One container for every database step. setup_admin only uses the
          # password when creating the first admin. Direct host: the pooler
          # drops the session lock migrate uses. Failure output is redacted
          # so a database URL cannot land in the log.
          if [ -z "${DJANGO_SUPERUSER_PASSWORD:-}" ]; then
            echo "::error::Set the repository secret DJANGO_SUPERUSER_PASSWORD. There is no default admin password when DEBUG=False."
            exit 1
          fi
          if ! docker run --rm --entrypoint python \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION="$AWS_REGION" \
            -e SERVERLESS=1 \
            -e DEBUG=False \
            -e ALLOWED_HOSTS \
            -e EMAIL_PROVIDER=console \
            -e DATABASE_USE_DIRECT=1 \
            -e DJANGO_SUPERUSER_EMAIL \
            -e DJANGO_SUPERUSER_PASSWORD \
            -e SSM_SECRET_KEY_NAME \
            -e SSM_DATABASE_URL_NAME \
            "$IMMUTABLE_IMAGE" \
            -c 'import subprocess
steps = [
    ["manage.py", "migrate", "--noinput"],
    ["manage.py", "createcachetable"],
    ["manage.py", "seed_flags"],
    ["manage.py", "setup_admin"],
]
for step in steps:
    print("--> " + " ".join(step[1:]), flush=True)
    subprocess.check_call(step)
' >"$RUNNER_TEMP/startup.txt" 2>&1; then
            echo "::error::Database startup failed. Migrations were not rolled back."
            sed -E 's#postgres(ql)?://[^[:space:]]+#<database-url>#g' "$RUNNER_TEMP/startup.txt" || true
            exit 1
          fi

      - name: Update the existing Lambda function
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$IMMUTABLE_IMAGE" \
            --region "$AWS_REGION" \
            --query "Code.ImageUri" \
            --output text
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION"
