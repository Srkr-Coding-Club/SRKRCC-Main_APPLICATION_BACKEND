version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: srkrcc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d srkrcc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "prod-secret-srkr-coding-club-change-this-in-live-prod"
      DATABASE_URL: "postgres://postgres:postgrespassword@db:5432/srkrcc_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOW_ALL_ORIGINS: "True"
      DJANGO_SUPERUSER_EMAIL: "admin@srkr.ac.in"
      DJANGO_SUPERUSER_PASSWORD: "Admin@123"
      DJANGO_SUPERUSER_USERNAME: "admin"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../SRKRCC-Main_APPLICATION_FRONTEND
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
