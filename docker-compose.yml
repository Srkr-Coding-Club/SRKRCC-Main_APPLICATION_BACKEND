version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: srkrcc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d srkrcc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "${DEBUG:-True}"
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD}@db:5432/srkrcc_db"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOW_ALL_ORIGINS: "True"
      RUN_STARTUP_TASKS: "1"
      WEB_CONCURRENCY: "3"
      EMAIL_PROVIDER: "console"
      DJANGO_SUPERUSER_EMAIL: "srkrcodingclubofficial@gmail.com"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:?set DJANGO_SUPERUSER_PASSWORD in .env}"
      DJANGO_SUPERUSER_USERNAME: "admin"
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "120"]
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../SRKRCC-Main_APPLICATION_FRONTEND
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
